# =============================================================================
# Pipeline de la plantilla.
#
# Este repositorio distribuye infraestructura, no una aplicacion, asi que el
# pipeline tiene dos niveles:
#
#   1. 'plantilla' se ejecuta SIEMPRE y valida lo que aqui se publica: que el
#      Compose sea valido, que los Dockerfiles pasen el lint y que la
#      configuracion de Nginx arranque de verdad. Es la garantia de que lo que
#      alguien copie a su proyecto esta bien formado.
#
#   2. El resto solo se ejecuta si el proyecto tiene aplicacion (pom.xml y
#      package.json). En este repositorio no la hay, asi que se saltan. En el
#      proyecto que copie la plantilla se activan solos.
#
# Requisitos para publicar imagenes (Settings > Secrets and variables > Actions):
#   Variable : DOCKERHUB_USERNAME
#   Secret   : DOCKERHUB_TOKEN
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  plantilla:
    name: Validar la plantilla
    runs-on: ubuntu-latest
    outputs:
      hay_backend: ${{ steps.detectar.outputs.hay_backend }}
      hay_frontend: ${{ steps.detectar.outputs.hay_frontend }}
    steps:
      - uses: actions/checkout@v5

      - name: Detectar si el proyecto tiene aplicacion
        id: detectar
        run: |
          if [ -f backend/pom.xml ]; then
            echo "hay_backend=true" >> "$GITHUB_OUTPUT"
            echo "backend: pom.xml encontrado"
          else
            echo "hay_backend=false" >> "$GITHUB_OUTPUT"
            echo "backend: sin pom.xml, los jobs de backend se saltan"
          fi
          if [ -f frontend/package.json ]; then
            echo "hay_frontend=true" >> "$GITHUB_OUTPUT"
            echo "frontend: package.json encontrado"
          else
            echo "hay_frontend=false" >> "$GITHUB_OUTPUT"
            echo "frontend: sin package.json, los jobs de frontend se saltan"
          fi

      - name: Preparar variables de entorno
        run: cp .env.example .env

      - name: El docker-compose.yml es valido
        run: |
          docker compose config --quiet
          echo "Compose valido. Servicios declarados:"
          docker compose config --services

      - name: El nombre del proyecto esta parametrizado
        run: |
          # Con otro valor de PROYECTO, los contenedores deben renombrarse.
          # Si alguien vuelve a fijar un nombre a mano, esto lo detecta.
          nombres=$(PROYECTO=prueba-plantilla docker compose config | grep container_name || true)
          echo "$nombres"
          echo "$nombres" | grep -q "prueba-plantilla-db" \
            || { echo "El nombre del proyecto no se esta aplicando"; exit 1; }

      - name: Los Dockerfiles pasan el lint
        run: |
          docker build --check ./backend
          docker build --check ./frontend

      - name: La configuracion de Nginx arranca
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Los YAML son correctos
        run: |
          python3 -c "
          import glob, sys, yaml
          for f in ['docker-compose.yml'] + glob.glob('.github/workflows/*.yml') + glob.glob('**/application-*.yml', recursive=True):
              yaml.safe_load(open(f, encoding='utf-8'))
              print('OK  ', f)
          "

  # ---------------------------------------------------------------------------
  backend:
    name: Backend · tests y cobertura
    runs-on: ubuntu-latest
    needs: [plantilla]
    if: needs.plantilla.outputs.hay_backend == 'true'
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testear y verificar cobertura
        run: mvn -B -ntp verify

      - name: Resumen de cobertura
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1 {miss+=$4; cov+=$5} END {
              total=miss+cov
              if (total>0) printf "## Cobertura de instrucciones: %.1f%%\n\n(%d de %d cubiertas)\n", cov*100/total, cov, total
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · lint, tests y build
    runs-on: ubuntu-latest
    needs: [plantilla]
    if: needs.plantilla.outputs.hay_frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Tests
        run: npm run test --if-present -- --watch=false --browsers=ChromeHeadless

      - name: Build de produccion
        run: npm run build -- --configuration=production

  # ---------------------------------------------------------------------------
  humo:
    name: Smoke test · docker compose
    runs-on: ubuntu-latest
    needs: [plantilla, backend, frontend]
    if: needs.plantilla.outputs.hay_backend == 'true' && needs.plantilla.outputs.hay_frontend == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Preparar variables de entorno
        run: cp .env.example .env

      - name: Construir y levantar el stack
        run: |
          docker compose build
          docker compose up -d

      - name: Esperar a que el backend este sano
        run: |
          nombre="$(grep -E '^PROYECTO=' .env | cut -d= -f2)"
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' "${nombre}-backend" 2>/dev/null || echo "starting")
            echo "intento $i -> $estado"
            [ "$estado" = "healthy" ] && exit 0
            sleep 5
          done
          echo "El backend no llego a estado healthy"
          docker compose logs --tail=100
          exit 1

      - name: Verificar endpoints
        run: |
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://localhost:4200/ > /dev/null
          echo "Backend y frontend responden correctamente"

      - name: Logs (solo si algo fallo)
        if: failure()
        run: docker compose logs --tail=200

      - name: Limpiar
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  publicar:
    name: Publicar imagenes en Docker Hub
    runs-on: ubuntu-latest
    needs: [humo]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.PROYECTO || 'miapp' }}-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.PROYECTO || 'miapp' }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.PROYECTO || 'miapp' }}-frontend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.PROYECTO || 'miapp' }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

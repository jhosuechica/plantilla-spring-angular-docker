server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compresion ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # --- Cabeceras de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Assets con hash en el nombre: cache agresivo ---
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- index.html nunca se cachea: es quien apunta a los assets nuevos ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Proxy hacia el backend ---
    # El navegador llama a /api/... (mismo origen) => sin CORS ni URLs
    # hardcodeadas por ambiente en el codigo Angular.
    # "backend" es el nombre del servicio en docker-compose.yml; el DNS
    # interno de Docker lo resuelve.
    location /api/ {
        # Resolver DNS interno de Docker. Al usar una VARIABLE en proxy_pass,
        # nginx resuelve el nombre en cada peticion y no al cargar la config.
        # Sin esto, si el backend no esta arriba, nginx falla al arrancar con
        # "host not found in upstream" y el frontend entero no levanta.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend "backend:8080";

        # $request_uri conserva la ruta original completa (/api/...),
        # equivalente a proxy_pass http://backend:8080/api/;
        proxy_pass http://$upstream_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- Fallback de SPA ---
    # Sin esto, recargar /indicadores/5 devuelve 404 porque esa ruta solo
    # existe en el router de Angular, no como archivo en disco.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
